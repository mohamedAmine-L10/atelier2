class Rectangle{
    constructor(largeur=0,longueur=0){
        this.nom = "rectangle";
        this.lar = largeur;
        this.long=longueur;
    }
    afficher(){
        console.log(` le nom: ${this.nom} la longueur est: ${this.long} et la largeur du rectangle est: ${this.lar}`);
    }
    surface(){
        return this.lar*this.long;
    }
}

class Carre extends Rectangle{
    constructor(cote){
        super(cote,cote);
        this.nom="carre";
    }

}
